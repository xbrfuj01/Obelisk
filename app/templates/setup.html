{% extends "base.html" %}
{% block content %}
<div class="login-page">
  <div class="login-box">
    <h1>Перший запуск</h1>
    <p class="hero-sub" style="margin-bottom: 18px;">Створіть перший обліковий запис — він одразу отримає права адміністратора.</p>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <form method="post" action="/setup" class="card login-form">
      <label>Логін
        <input type="text" name="username" required autofocus autocomplete="username">
      </label>
      <label>Пароль
        <input type="password" name="password" required autocomplete="new-password">
      </label>
      <label>Підтвердження пароля
        <input type="password" name="password_confirm" required autocomplete="new-password">
      </label>
      <button type="submit">Створити адміністратора</button>
    </form>
  </div>
</div>
{% endblock %}
