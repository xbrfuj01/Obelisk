{% extends "base.html" %}
{% block content %}
<a href="/" class="back-link" title="Усі інструменти" aria-label="Усі інструменти"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5"/><path d="M5 10v10a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V10"/></svg></a>
<div class="hero">
  <h1>Редактор метаданих</h1>
  <p class="hero-sub">Завантаж будь-який файл (зображення, відео, аудіо, PDF, документи) — покажемо всі приховані метадані та зробимо чисту копію без них.</p>
</div>

<form id="metadata-form" class="card">
  <label>Файл
    <div class="file-input-row">
      <button type="button" class="file-choose-btn" id="file-choose-btn">Обрати файл</button>
      <button type="submit" class="btn-primary">Прочитати метадані</button>
      <span class="file-name" id="file-name">Файл не обрано</span>
      <input type="file" name="file" id="file-input" required hidden>
    </div>
    <span class="hint">Максимальний розмір файлу: {{ max_upload_mb }} МБ.</span>
  </label>
</form>

<div id="status-box"></div>
<div id="result-box"></div>
{% endblock %}
{% block scripts %}
<script src="/static/metadata.js"></script>
{% endblock %}
