<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Obelisk{% endblock %}</title>
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="bg-glow"></div>
<header class="topbar">
  <a href="/" class="brand"><span class="brand-icon">◆</span> Obelisk</a>
  <nav>
    <div class="processes-wrap" id="processes-wrap" hidden>
      <button type="button" class="processes-btn" id="processes-btn" title="Процеси" aria-label="Процеси">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        <span class="processes-badge" id="processes-badge" hidden>0</span>
      </button>
      <div class="processes-panel" id="processes-panel" hidden>
        <div class="processes-panel-header">Процеси</div>
        <div class="processes-list" id="processes-list"></div>
      </div>
    </div>
    {% if is_admin_request(request) %}
    <a href="/admin" class="admin-link" title="Адмін-панель" aria-label="Адмін-панель"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></a>
    {% endif %}
  </nav>
</header>
<main class="container">
{% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
<script src="/static/processes.js"></script>
</body>
</html>
