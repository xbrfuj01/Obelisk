services:
  obelisk:
    image: ghcr.io/xbrfuj01/obelisk:latest
    pull_policy: always
    container_name: obelisk
    ports:
      - "30301:30301"
    volumes:
      - /mnt/vault/obelisk/data:/data
      - /mnt/vault/obelisk/downloads:/downloads
    restart: unless-stopped
    depends_on:
      - bgutil-provider

  # Generates YouTube's "proof of origin" tokens for yt-dlp - without this,
  # YouTube silently refuses some videos/formats to non-browser clients
  # ("This video is not available") even from an IP that can watch them
  # fine in a real browser. obelisk reaches it over the compose network as
  # "bgutil-provider" (see downloader.py's extractor_args).
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    pull_policy: always
    container_name: obelisk-bgutil-provider
    init: true
    restart: unless-stopped
